name: gkit-linux-build-test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test on Ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        preset: [ "x86_64-gcc-debug", "x86_64-llvm-debug" ]
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Show build information
      run: |
        echo "🚀 Starting build for gkit project"
        echo "Platform: ${{ runner.os }}"
        echo "Workflow: ${{ github.workflow }}"
        echo "Repository: ${{ github.repository }}"
        echo "Commit SHA: ${{ github.sha }}"

    - name: Install dependencies
      run: |
        echo "📦 Installing Ubuntu dependencies..."
        sudo apt-get update
        sudo apt-get install -y \
        build-essential clang cmake ninja-build python3-jinja2 \
        libasound2-dev libpulse-dev libx11-dev libxext-dev \
        libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
        libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev \
        libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
        libdbus-1-dev libibus-1.0-dev libudev-dev
        echo "✅ Ubuntu dependencies installed successfully"

    - name: Configure CMake
      run: |
        echo "⚙️ Configuring CMake for Linux..."
        echo "Using preset: ${{matrix.preset}}"
        cmake --preset ${{matrix.preset}}
        echo "✅ CMake configuration completed"

    - name: Configure and build project
      run: |
        echo "🔨 Building project on Linux..."
        BUILD_DIR="${{ github.workspace }}/build/${{matrix.preset}}"
        echo "Build directory: $BUILD_DIR"
        cmake --build $BUILD_DIR
        echo "✅ Linux build completed successfully"

    - name: Run non-interactive tests
      run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

    - name: Show build results
      run: |
        echo "🎉 Build process completed!"
        echo "Platform: Linux(Ubuntu-latest)"
        echo "Job status: ${{ job.status }}"
        
        # List built files
        echo "📁 Built files:"
        find ${{ github.workspace }}/build -name "*.so" -o -name "*.dll" -o -name "*.a" -o -name "*.lib" 2>/dev/null || echo "No library files found"
        
        # Show disk usage
        echo "💾 Disk usage:"
        du -sh ${{ github.workspace }}/build 2>/dev/null || echo "Build directory size info not available"

    - name: Check memory and undefined behavior
      if: matrix.preset == 'x86_64-gcc-debug'
      run: |
        cmake --preset ${{ matrix.preset }} -DGKIT_SANITIZER=address
        cmake --build build/${{ matrix.preset }} --parallel 2
        ctest --test-dir build/${{ matrix.preset }} --output-on-failure

    - name: Check thread safety
      if: matrix.preset == 'x86_64-gcc-debug'
      run: |
        # These unit tests do not need desktop integration. Avoid libdbus lock-order
        # warnings during SDL initialization while keeping TSan deadlock detection enabled.
        # SDL's IBus input method support also requires D-Bus.
        cmake --preset ${{ matrix.preset }} -B build/x86_64-gcc-tsan \
          -DBIN_FOLDER="${{ github.workspace }}/bin/x86_64-gcc-tsan" \
          -DGKIT_SANITIZER=thread -DSDL_DBUS=OFF -DSDL_IBUS=OFF
        cmake --build build/x86_64-gcc-tsan --parallel 2
        ctest --test-dir build/x86_64-gcc-tsan --output-on-failure -R 'test_(value|registry_concurrency|input_snapshot|resource_loader|log_flush)$'
